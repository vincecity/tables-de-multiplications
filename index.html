<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2858a3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tables 1-12" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Révision des tables de multiplication</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chango&family=Manrope:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Tables de multiplication</h1>

      <section class="table-picker" aria-label="Sélection des tables">
        <div class="table-picker-head">
          <button
            id="toggle-table-picker"
            class="table-picker-toggle"
            type="button"
            aria-expanded="true"
            aria-controls="table-picker-content"
          >
            <span class="label">Tables à réviser</span>
            <span id="table-picker-chevron" class="table-picker-chevron" aria-hidden="true">▾</span>
          </button>
        </div>
        <div id="table-picker-content" class="table-picker-content">
          <div class="table-picker-actions">
            <button id="select-all" class="ghost-btn" type="button">Tout</button>
            <button id="clear-all" class="ghost-btn" type="button">Aucune</button>
          </div>
          <div id="table-options" class="table-options"></div>
        </div>
      </section>

      <section class="quiz-card" aria-live="polite">
        <p class="label">Question</p>
        <p id="question" class="question">3 × 7 = ?</p>
        <div class="unicorn-stage" aria-hidden="true">
          <svg id="unicorn-happy" class="unicorn unicorn-happy" viewBox="0 0 220 170" role="img">
            <defs>
              <linearGradient id="maneHappy" x1="0" x2="1" y1="0" y2="1">
                <stop offset="0" stop-color="#ff7eb6" />
                <stop offset="1" stop-color="#8fd6ff" />
              </linearGradient>
            </defs>
            <circle cx="110" cy="92" r="56" fill="#ffffff" stroke="#ccd9f4" stroke-width="4" />
            <ellipse cx="68" cy="96" rx="18" ry="24" fill="#ffffff" stroke="#ccd9f4" stroke-width="4" />
            <ellipse cx="152" cy="96" rx="18" ry="24" fill="#ffffff" stroke="#ccd9f4" stroke-width="4" />
            <path d="M70 67c18-33 69-40 96-15-2 21-16 33-37 38-22 5-44-5-59-23z" fill="url(#maneHappy)" />
            <path d="M109 15l12 28h-24z" fill="#ffd66e" stroke="#f2b438" stroke-width="3" />
            <circle cx="90" cy="90" r="6" fill="#1f2f52" />
            <circle cx="130" cy="90" r="6" fill="#1f2f52" />
            <path d="M89 115c8 10 34 10 42 0" fill="none" stroke="#ff5f9a" stroke-width="5" stroke-linecap="round" />
            <circle cx="76" cy="106" r="7" fill="#ffc2da" />
            <circle cx="144" cy="106" r="7" fill="#ffc2da" />
            <circle cx="38" cy="43" r="5" fill="#ffd66e" />
            <circle cx="181" cy="45" r="5" fill="#ffd66e" />
          </svg>
          <svg id="unicorn-sad" class="unicorn unicorn-sad" viewBox="0 0 220 170" role="img">
            <defs>
              <linearGradient id="maneSad" x1="0" x2="1" y1="0" y2="1">
                <stop offset="0" stop-color="#9ab4ff" />
                <stop offset="1" stop-color="#e2b8ff" />
              </linearGradient>
            </defs>
            <circle cx="110" cy="92" r="56" fill="#ffffff" stroke="#ccd9f4" stroke-width="4" />
            <ellipse cx="68" cy="96" rx="18" ry="24" fill="#ffffff" stroke="#ccd9f4" stroke-width="4" />
            <ellipse cx="152" cy="96" rx="18" ry="24" fill="#ffffff" stroke="#ccd9f4" stroke-width="4" />
            <path d="M70 67c18-33 69-40 96-15-2 21-16 33-37 38-22 5-44-5-59-23z" fill="url(#maneSad)" />
            <path d="M109 15l12 28h-24z" fill="#ffd66e" stroke="#f2b438" stroke-width="3" />
            <path d="M84 89c3-6 9-6 12 0" fill="none" stroke="#1f2f52" stroke-width="3" stroke-linecap="round" />
            <path d="M124 89c3-6 9-6 12 0" fill="none" stroke="#1f2f52" stroke-width="3" stroke-linecap="round" />
            <path d="M89 121c8-8 34-8 42 0" fill="none" stroke="#6c7fae" stroke-width="5" stroke-linecap="round" />
            <ellipse cx="83" cy="100" rx="3" ry="6" fill="#8dc8ff" />
            <ellipse cx="137" cy="100" rx="3" ry="6" fill="#8dc8ff" />
            <circle cx="42" cy="48" r="4" fill="#b9c6e9" />
            <circle cx="176" cy="42" r="4" fill="#b9c6e9" />
          </svg>
        </div>

        <form id="answer-form" autocomplete="off">
          <label for="answer" class="sr-only">Votre réponse</label>
          <input
            id="answer"
            name="answer"
            type="number"
            inputmode="numeric"
            placeholder="Ta réponse"
            required
          />
          <button type="submit">Valider</button>
        </form>

        <p id="feedback" class="feedback" role="status"></p>
      </section>

      <section class="stats" aria-label="Statistiques">
        <div>
          <span id="correct-count">0</span>
          <small>Bonnes réponses</small>
        </div>
        <div>
          <span id="total-count">0</span>
          <small>Questions</small>
        </div>
        <div>
          <span id="accuracy">0%</span>
          <small>Précision</small>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
